<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ECE Store Components</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f9;color:#172033}
header{background:linear-gradient(135deg,#173b8f,#2457d6);color:#fff;padding:30px 18px}
.wrap{max-width:1280px;margin:auto}
h1{margin:0 0 6px;font-size:30px}
.sub{margin:0;opacity:.9}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
input,select{border:0;border-radius:9px;padding:12px 14px;font-size:15px;outline:none}
.search{flex:1;min-width:260px}
main{padding:24px 18px}
.stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #e3e7ee;border-radius:12px;padding:12px 18px;min-width:150px}
.stat b{display:block;font-size:21px}
.stat span{font-size:13px;color:#667085}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:#fff;border:1px solid #e3e7ee;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #0001;display:flex;flex-direction:column}
.photo{height:215px;background:#fff;display:flex;align-items:center;justify-content:center;padding:15px;border-bottom:1px solid #e9ecf1}
.photo img{max-width:100%;max-height:190px;object-fit:contain}
.noimg{color:#98a2b3;font-size:14px;text-align:center;padding:20px}
.body{padding:16px;display:flex;flex-direction:column;flex:1}
.title{font-weight:700;font-size:17px;line-height:1.4;margin-bottom:10px}
.meta{font-size:13px;color:#475467;margin-bottom:8px}
.meta b{color:#172033}
.description{font-size:13px;line-height:1.5;color:#667085;margin:4px 0 8px}
.description b{color:#172033}
.location{display:inline-block;width:max-content;margin:10px 0 12px;background:#eef3ff;color:#2457d6;padding:6px 10px;border-radius:20px;font-weight:bold;font-size:13px}
.actions{display:flex;gap:8px;margin-top:auto}
.btn{flex:1;text-align:center;text-decoration:none;padding:10px 8px;border-radius:8px;font-weight:bold;font-size:14px;border:1px solid #d9dee8}
.view{background:#2457d6;color:#fff;border-color:#2457d6}
.disabled{background:#f2f4f7;color:#98a2b3;cursor:default}
.empty{text-align:center;padding:60px;color:#667085}
@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:25px}}
</style>
</head>
<body>

<header>
<div class="wrap">
<h1>ECE Store Components</h1>
<p class="sub">Component inventory and catalogue</p>
<div class="controls">
<input id="q" class="search" placeholder="Search description, part no or location...">
<select id="locationFilter">
<option value="all">All Locations</option>
</select>
<select id="sort">
<option value="description">Sort: Description</option>
<option value="location">Sort: Location</option>
<option value="part">Sort: Part No</option>
</select>
</div>
</div>
</header>

<main class="wrap">
<div class="stats">
<div class="stat"><b id="shown">0</b><span>Components shown</span></div>
<div class="stat"><b id="withImages">0</b><span>Components with image</span></div>
<div class="stat"><b id="locations">0</b><span>Locations shown</span></div>
</div>

<div id="grid" class="grid"></div>
<div id="empty" class="empty" style="display:none">No components found.</div>
</main>

function esc(v){
 return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
 .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function titleCase(v){
 const s=String(v??'').trim();
 return s.replace(/\b[A-Za-z][A-Za-z0-9-]*/g, word =>
   word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
 );
}

function populateLocations(){
 const sel=document.getElementById('locationFilter');
 const locs=[...new Set(items.map(x=>x.location).filter(Boolean))]
  .sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));
 locs.forEach(loc=>{
  const o=document.createElement('option');
  o.value=loc;o.textContent='Location: '+loc;sel.appendChild(o);
 });
}

function render(){
 const q=document.getElementById('q').value.toLowerCase().trim();
 const loc=document.getElementById('locationFilter').value;
 const sort=document.getElementById('sort').value;

 let list=items.filter(x=>{
   const text=(x.description+' '+x.part+' '+x.id+' '+x.location).toLowerCase();
   return (!q||text.includes(q)) && (loc==='all'||x.location===loc);
 });

 if(sort==='description') list.sort((a,b)=>a.description.localeCompare(b.description));
 if(sort==='location') list.sort((a,b)=>String(a.location).localeCompare(String(b.location),undefined,{numeric:true}));
 if(sort==='part') list.sort((a,b)=>String(a.part).localeCompare(String(b.part),undefined,{numeric:true}));

 document.getElementById('shown').textContent=list.length;
 document.getElementById('withImages').textContent=list.filter(x=>x.image).length;
 document.getElementById('locations').textContent=new Set(list.map(x=>x.location).filter(Boolean)).size;

 const grid=document.getElementById('grid');
 const empty=document.getElementById('empty');
 grid.innerHTML='';
 empty.style.display=list.length?'none':'block';

 list.forEach(x=>{
   let imgHTML;
   if(x.image){
     const img = `<img src="${esc(x.image)}" alt="${esc(x.description)}" loading="lazy" referrerpolicy="no-referrer"
       onerror="this.style.display='none'">`;
     imgHTML = x.link
       ? `<a href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">${img}</a>`
       : img;
   } else {
     imgHTML = `<div style="width:100%;height:100%;background:#fff"></div>`;
   }

   const button=x.link
    ? `<a class="btn view" href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">View Product</a>`
    : `<span class="btn disabled">No Product Link</span>`;

   grid.insertAdjacentHTML('beforeend',`
   <article class="card">
     <div class="photo">${imgHTML}</div>
     <div class="body">
       <div class="title">${esc(titleCase(x.description) || 'Component')}</div>
       <div class="meta"><b>Part No:</b> ${esc(x.part || '—')}</div>
       <div class="description"><b>Description:</b> ${esc(titleCase(x.description) || '—')}</div>
       <div class="location">Location: ${esc(x.location || '—')}</div>
       <div class="actions">${button}</div>
     </div>
   </article>`);
 });
}

populateLocations();
document.getElementById('q').addEventListener('input',render);
document.getElementById('locationFilter').addEventListener('change',render);
document.getElementById('sort').addEventListener('change',render);
render();
</script>
