<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECE Store Components</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f9;color:#172033}
header{background:linear-gradient(135deg,#173b8f,#2457d6);color:#fff;padding:30px 18px}
.wrap{max-width:1280px;margin:auto}h1{margin:0 0 6px;font-size:30px}.sub{margin:0;opacity:.9}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
input,select{border:0;border-radius:9px;padding:12px 14px;font-size:15px;outline:none}.search{flex:1;min-width:260px}
main{padding:24px 18px}.stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #e3e7ee;border-radius:12px;padding:12px 18px;min-width:150px}.stat b{display:block;font-size:21px}.stat span{font-size:13px;color:#667085}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:#fff;border:1px solid #e3e7ee;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #0001;display:flex;flex-direction:column}
.photo{height:215px;background:#fff;display:flex;align-items:center;justify-content:center;padding:15px;border-bottom:1px solid #e9ecf1}
.photo img{max-width:100%;max-height:190px;object-fit:contain}
.body{padding:16px;display:flex;flex-direction:column;flex:1}.name{font-weight:700;font-size:17px;line-height:1.4;margin-bottom:9px}
.part{font-size:13px;color:#475467;margin-bottom:7px}.part b{color:#172033}
.desc{font-size:13px;line-height:1.45;color:#667085;min-height:38px}
.qty{display:inline-block;width:max-content;margin:12px 0;background:#eef3ff;color:#2457d6;padding:6px 10px;border-radius:20px;font-weight:bold;font-size:13px}
.actions{display:flex;gap:8px;margin-top:auto}.btn{flex:1;text-align:center;text-decoration:none;padding:10px 8px;border-radius:8px;font-weight:bold;font-size:14px;border:1px solid #d9dee8}
.view{background:#2457d6;color:#fff;border-color:#2457d6}.empty{text-align:center;padding:60px;color:#667085}
@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:25px}}
</style></head><body>

<script>
  Papa.parse("components.csv", {
    download: true,

      for (let key in data[0]) {
        table += "<th>" + key + "</th>";
      }
      table += "</tr>";
      // Create rows
      data.forEach(row => {

        for (let key in row) {
          table += "<td>" + row[key] + "</td>";

      });
      table += "</table>";
      document.getElementById("inventory").innerHTML = table;
    }
