<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Inventory Webpage</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }
    img {
      max-width: 100px;
      max-height: 100px;
    }
  </style>
</head>
<body>
  <h1>Component Inventory</h1>
  <table id="inventoryTable"></table>

  <script>
    Papa.parse("Components.csv", {
      download: true,
      header: true,
      complete: function(results) {
        const data = results.data;
        let table = "<tr>";
        for (let key in data[0]) {
          table += "<th>" + key + "</th>";
        }
        table += "</tr>";

        data.forEach(row => {
          table += "<tr>";
          for (let key in row) {
            if (key === "Photo link") {
              // Show image thumbnail if LINK exists
              if (row["LINK"]) {
                table += `<td><img src="${row["LINK"]}" alt="Image"></td>`;
              } else {
                table += "<td>" + row[key] + "</td>";
              }
            } else if (key === "LINK") {
              // Show clickable link
              if (row["LINK"]) {
                table += `<td><a href="${row["LINK"]}" target="_blank">${row["LINK"]}</a></td>`;
              } else {
                table += "<td>" + row[key] + "</td>";
              }
            } else {
              table += "<td>" + row[key] + "</td>";
            }
          }
          table += "</tr>";
        });

        document.getElementById("inventoryTable").innerHTML = table;
      }
    });
  </script>
</body>
</html>
