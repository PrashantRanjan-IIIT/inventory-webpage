<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESW Component Inventory</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #e6e9ef;position:sticky;top:0;z-index:10}
.wrap{max-width:1200px;margin:auto;padding:20px}
h1{margin:0;font-size:28px}
.sub{color:#687386;margin-top:6px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
input,select{border:1px solid #d8dde7;background:#fff;border-radius:10px;padding:12px 14px;font-size:15px;outline:none}
input{flex:1;min-width:260px}
select{min-width:190px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
.stat{background:#fff;border:1px solid #e6e9ef;border-radius:12px;padding:14px 18px;min-width:150px}
.stat b{display:block;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:#fff;border:1px solid #e6e9ef;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(20,30,50,.04)}
.pic{height:190px;background:#fafbfc;display:flex;align-items:center;justify-content:center;padding:14px}
.pic img{max-width:100%;max-height:165px;object-fit:contain}
.noimg{color:#9aa3b2;font-size:14px}
.content{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.name{font-weight:650;line-height:1.35;font-size:16px}
.qty{display:inline-flex;width:max-content;background:#eef6ff;border-radius:999px;padding:5px 10px;font-size:13px}
.actions{margin-top:auto}
.btn{display:block;text-align:center;text-decoration:none;background:#172033;color:#fff;border-radius:9px;padding:10px 12px;font-size:14px}
.empty{text-align:center;padding:50px;color:#687386;display:none}
footer{text-align:center;color:#7b8494;font-size:13px;padding:35px}
@media(max-width:600px){.wrap{padding:14px}h1{font-size:23px}.pic{height:160px}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>ESW Component Inventory</h1>
<div class="sub">Electronics components and purchase catalogue</div>
<div class="toolbar">
<input id="search" type="search" placeholder="Search component...">
<select id="qtyFilter">
<option value="all">All quantities</option>
<option value="available">Available (1+)</option>
<option value="low">Low stock (1–2)</option>
</select>
</div>
</div></header>

<main class="wrap">
<div class="stats">
<div class="stat"><b id="shown">0</b>Components shown</div>
<div class="stat"><b id="totalQty">0</b>Total quantity</div>
</div>
<div id="grid" class="grid"></div>
<div id="empty" class="empty">No matching components found.</div>
</main>
<footer>ESW Component Inventory</footer>

<script>
const items = [{"component": "Time-of-Flight VL53L0/1XV2 Laser Ranging Sensor (ToF)", "quantity": 3, "image": "https://static.flyrobo.in/image/cache/wp/gj/gy-53-vl53l0x-laser-tof-flight-time-ranging-sensor-module/gy-53-vl53l0x-laser-tof-flight-time-ranging-sensor-module-2-550x550.webp", "purchase": "https://www.flyrobo.in/time-flight-vl53l0-1xv2-laser-ranging-sensor-tof?tracking=ads&tracking=feed1505&gad_source=1&gad_campaignid=23845158606&gclid=CjwKCAjwwL_UBhAjEiwAEhuT5PYxz1q71GQeSac1EREg148FyqiQDMXU-IWYV3eAYhNC7H01HgDALRoCn-MQAvD_BwE"}, {"component": "MPU9250", "quantity": 4, "image": "https://roboticsdna.in/wp-content/uploads/2021/10/mpu9250.jpg", "purchase": "https://www.amazon.in/SixOhms-Accelerometer-Gyroscope-Magnetometer-Navigation/dp/B0G1LR7YCL"}, {"component": "ERM Vibration motors 3V", "quantity": 4, "image": "https://m.media-amazon.com/images/I/61GuVrFTldL._SL1500_.jpg", "purchase": "https://www.amazon.in/Vibration-10000RPM-High-Speed-Projects-Electronics/dp/B0F91TCGV4/"}, {"component": "SmartElex micro USB single cell connector", "quantity": 1, "image": "https://m.media-amazon.com/images/I/51h85IOPZ-L._SL1100_.jpg", "purchase": "https://www.amazon.in/SmartElex-microUSB-Single-Cell-Connector-Projects/dp/B0GY8RWKTJ"}, {"component": "CD74HC4067 16 Channel Analog Multiplexer Breakout Module", "quantity": 5, "image": "https://www.hadex.cz/files/images/product/800/analogovy-multiplexer-16-ch-s-cd74hc4067-pdFy.jpg", "purchase": "https://robocraze.com/products/16-channel-analog-multiplexer"}, {"component": "OV5640", "quantity": 2, "image": "https://thepihut.com/cdn/shop/files/seeed-ov5640-camera-for-xiao-esp32s3-sense-seeed-106069-43165718118595_1000x.jpg?v=1726548414", "purchase": "https://evelta.com/ov5640-camera-for-xiao-esp32s3-sense-with-heat-sink-auto-focus-seeed-studio/?sku=078-114993115"}, {"component": "LD2410 mmWave Radar Sensor", "quantity": 2, "image": "https://down-my.img.susercontent.com/file/cn-11134207-7ras8-m3rotwhax5zq55", "purchase": "https://www.google.com/search?q=HLK-LD2410+24Ghz+Human+Body+Detection+Radar+Sensor+Module"}, {"component": "18650 Li-ion Battery", "quantity": 3, "image": "https://pmo1ae2a7-pic9.websiteonline.cn/upload/lk8z.jpg", "purchase": "https://www.google.com/search?q=18650+2600mAh+3.65V+Cylindrical+Lithium-ion+Cell"}, {"component": "Ai-Thinker Ra-02 LoRa Module (SX1278, 433MHz)", "quantity": 3, "image": "https://www.or97.com/wp-content/uploads/2021/05/Ra-02-SX1278-LoRa-Module-433Mhz-Ai-Thinker-.jpg", "purchase": "https://www.electropi.in/sx1278-lora-module-ra-02-433mhz-wireless-spread-spectrum-transmission"}, {"component": "ESP32-CAM-MB Programmer Shield", "quantity": 1, "image": "https://www.tomsonelectronics.com/cdn/shop/files/usb-ttl_serial_download_module_for_esp32_s-cam_mb_development_programming_board_micro_b_2.jpg?crop=center&height=1250&v=1765954929&width=1250", "purchase": "https://share.google/1sXGcGYF53Qo7lXz9"}, {"component": "433MHz Antenna (helical/IPEX or wire whip)", "quantity": 4, "image": "https://www.indianhobbycenter.com/cdn/shop/files/433MHzSpringAntenna3dbiIPEXInterfaceAntennaforLoraRA-02Module2.jpg?v=1762010212&width=416", "purchase": "https://share.google/8541mZcEPoOlGcSyJ"}, {"component": "ADXL355", "quantity": 3, "image": "https://img.fruugo.com/product/1/90/2393607901_0340_0340.jpg", "purchase": "https://robocraze.com/products/adxl335-triple-axis-accelerometer"}, {"component": "DS18B20 waterproof temperature probe", "quantity": 1, "image": "https://makerbazar.in/cdn/shop/products/DS18B20.jpg?v=1577792684&width=800", "purchase": "https://robu.in/product/ds18b20-water-proof-temperature-probe-black-1m/"}];

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const search = document.getElementById('search');
const qtyFilter = document.getElementById('qtyFilter');
const shown = document.getElementById('shown');
const totalQty = document.getElementById('totalQty');

function numQty(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function render() {
  const q = search.value.trim().toLowerCase();
  const f = qtyFilter.value;

  const filtered = items.filter(x => {
    const matchesText = !q || x.component.toLowerCase().includes(q);
    const n = numQty(x.quantity);
    const matchesQty =
      f === 'all' ||
      (f === 'available' && n > 0) ||
      (f === 'low' && n >= 1 && n <= 2);
    return matchesText && matchesQty;
  });

  shown.textContent = filtered.length;
  totalQty.textContent = filtered.reduce((s,x) => s + numQty(x.quantity), 0);
  empty.style.display = filtered.length ? 'none' : 'block';

  grid.innerHTML = filtered.map(x => {
    const img = x.image
      ? `<img src="${x.image}" alt="${escapeHtml(x.component)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\'noimg\'>Image unavailable</div>'">`
      : `<div class="noimg">No image</div>`;
    const link = x.purchase
      ? `<a class="btn" href="${x.purchase}" target="_blank" rel="noopener">View / Purchase</a>`
      : `<span class="noimg">No purchase link</span>`;

    return `<article class="card">
      <div class="pic">${img}</div>
      <div class="content">
        <div class="name">${escapeHtml(x.component)}</div>
        <span class="qty">Quantity: ${escapeHtml(String(x.quantity))}</span>
        <div class="actions">${link}</div>
      </div>
    </article>`;
  }).join('');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

search.addEventListener('input', render);
qtyFilter.addEventListener('change', render);
render();
</script>
</body>
</html>
