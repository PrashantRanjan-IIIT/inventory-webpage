<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECE Store Components</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f9;color:#172033}
header{background:linear-gradient(135deg,#173b8f,#2457d6);color:#fff;padding:30px 18px}
.wrap{max-width:1280px;margin:auto}
h1{margin:0 0 6px;font-size:30px}
.sub{margin:0;opacity:.9}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
input,select{border:0;border-radius:9px;padding:12px 14px;font-size:15px;outline:none}
.search{flex:1;min-width:260px}
main{padding:24px 18px}
.stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #e3e7ee;border-radius:12px;padding:12px 18px;min-width:150px}
.stat b{display:block;font-size:21px}
.stat span{font-size:13px;color:#667085}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:#fff;border:1px solid #e3e7ee;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #0001;display:flex;flex-direction:column}
.photo{height:215px;background:#fff;display:flex;align-items:center;justify-content:center;padding:15px;border-bottom:1px solid #e9ecf1}
.photo img{max-width:100%;max-height:190px;object-fit:contain}
.noimg{color:#98a2b3;font-size:14px}
.body{padding:16px;display:flex;flex-direction:column;flex:1}
.name{font-weight:700;font-size:17px;line-height:1.4;margin-bottom:9px}
.part{font-size:13px;color:#475467;margin-bottom:7px}
.part b{color:#172033}
.desc{font-size:13px;line-height:1.45;color:#667085;min-height:38px}
.qty{display:inline-block;width:max-content;margin:12px 0;background:#eef3ff;color:#2457d6;padding:6px 10px;border-radius:20px;font-weight:bold;font-size:13px}
.actions{display:flex;gap:8px;margin-top:auto}
.btn{flex:1;text-align:center;text-decoration:none;padding:10px 8px;border-radius:8px;font-weight:bold;font-size:14px;border:1px solid #d9dee8}
.view{background:#2457d6;color:#fff;border-color:#2457d6}
.disabled{background:#f2f4f7;color:#98a2b3;cursor:default}
.empty{text-align:center;padding:60px;color:#667085}
@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:25px}}
</style>
</head>
<body>
<header>
<div class="wrap">
<h1>ECE Store Components</h1>
<p class="sub">Component inventory and catalogue</p>
<div class="controls">
<input id="q" class="search" placeholder="Search component, description or part no...">
<select id="stock">
<option value="all">All store stock</option>
<option value="available">Available in Store</option>
<option value="low">Low Store Stock (1–2)</option>
<option value="out">Out of Store Stock</option>
</select>
<select id="sort">
<option value="name">Sort: Component Name</option>
<option value="hi">Store Quantity: High to Low</option>
<option value="lo">Store Quantity: Low to High</option>
</select>
</div>
</div>
</header>

<main class="wrap">
<div class="stats">
<div class="stat"><b id="shown">0</b><span>Components shown</span></div>
<div class="stat"><b id="total">0</b><span>Total store quantity</span></div>
</div>
<div id="grid" class="grid"></div>
<div id="empty" class="empty" style="display:none">No components found.</div>
</main>

function esc(v){
 return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
 .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function render(){
 const q=document.getElementById('q').value.toLowerCase().trim();
 const stock=document.getElementById('stock').value;
 const sort=document.getElementById('sort').value;

 let list=items.filter(x=>{
   const qty=Number(x.store_qty)||0;
   const text=(x.name+' '+x.description+' '+x.part+' '+x.id).toLowerCase();
   const searchOk=!q||text.includes(q);
   let stockOk=true;
   if(stock==='available') stockOk=qty>0;
   if(stock==='low') stockOk=qty>=1&&qty<=2;
   if(stock==='out') stockOk=qty<=0;
   return searchOk&&stockOk;
 });

 if(sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
 if(sort==='hi') list.sort((a,b)=>(Number(b.store_qty)||0)-(Number(a.store_qty)||0));
 if(sort==='lo') list.sort((a,b)=>(Number(a.store_qty)||0)-(Number(b.store_qty)||0));

 document.getElementById('shown').textContent=list.length;
 document.getElementById('total').textContent=list.reduce((s,x)=>s+(Number(x.store_qty)||0),0);

 const grid=document.getElementById('grid');
 const empty=document.getElementById('empty');
 grid.innerHTML='';
 empty.style.display=list.length?'none':'block';

 list.forEach(x=>{
   const image=x.image
     ? `<img src="${esc(x.image)}" alt="${esc(x.name)}" loading="lazy" onerror="this.parentElement.innerHTML='<span class=&quot;noimg&quot;>Image unavailable</span>'">`
     : `<span class="noimg">No image available</span>`;

   const button=x.link
     ? `<a class="btn view" href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">View Product</a>`
     : `<span class="btn disabled">No Product Link</span>`;

   grid.insertAdjacentHTML('beforeend',`
   <article class="card">
     <div class="photo">${image}</div>
     <div class="body">
       <div class="name">${esc(x.name)}</div>
       <div class="part"><b>Part No:</b> ${esc(x.part||'—')}</div>
       <div class="desc">${esc(x.description)}</div>
       <div class="qty">Store Qty: ${esc(x.store_qty)}</div>
       <div class="actions">${button}</div>
     </div>
   </article>`);
 });
}

document.getElementById('q').addEventListener('input',render);
document.getElementById('stock').addEventListener('change',render);
document.getElementById('sort').addEventListener('change',render);
render();
</script>
